name: Case 006 H8 symbol certificate
on:
  push:
    paths:
      - "cases/006/attack002/**"
      - "cases/006/attack003/**"
      - "cases/006/attack004/**"
      - "cases/006/attack005/**"
      - "cases/006/attack006/**"
      - "cases/006/attack007/**"
      - "cases/006/attack008/**"
      - "cases/006/attack009/**"
      - "cases/006/attack010/**"
      - "cases/006/attack011/**"
      - "cases/006/attack012/**"
      - "cases/006/attack013/**"
      - "cases/006/attack014/**"
      - "cases/006/attack015/**"
      - "cases/006/attack016/**"
      - "cases/006/attack017/**"
      - "cases/006/attack018/**"
      - "cases/006/attack019/**"
      - "cases/006/attack020/**"
      - "cases/006/attack021/**"
      - "cases/006/attack022/**"
      - "cases/006/attack023/**"
      - "cases/006/attack024/**"
      - "cases/006/attack025/**"
      - "cases/006/attack026/**"
      - "cases/006/attack027/**"
      - "cases/006/attack028/**"
      - "cases/006/paper/**"
      - ".github/workflows/case006-h8-symbol.yml"
  pull_request:
    paths:
      - "cases/006/attack002/**"
      - "NewtonConjectures/Case006H8Symbol.lean"
      - "NewtonConjectures/Case006Ungauged.lean"
      - "NewtonConjectures/Case006QuadraticMoments.lean"
      - "NewtonConjectures/Case006FiniteType.lean"
      - "NewtonConjectures/Case006SourceJacobian.lean"
      - "NewtonConjectures/Case006JacobianConditioning.lean"
      - "NewtonConjectures/Case006TiltTorque.lean"
      - "NewtonConjectures/Case006C4Quadratic.lean"
      - "NewtonConjectures/Case006FrameTransport.lean"
      - "NewtonConjectures/Case006CylindricalTorque.lean"
      - "NewtonConjectures/Case006ExactViscousActuator.lean"
      - "NewtonConjectures/Case006MixedProfileControls.lean"
      - "NewtonConjectures/Case006NormalizedInverse.lean"
      - "NewtonConjectures/Case006AngularFlux.lean"
      - "NewtonConjectures/Case006RadialAngularDual.lean"
      - "NewtonConjectures/Case006AngularWeakDuality.lean"
      - "NewtonConjectures/Case006InteriorSmoothLifting.lean"
      - "NewtonConjectures/Case006FlatBoundaryAdaptive.lean"
      - "NewtonConjectures/Case006PiolaFlatLifting.lean"
      - "NewtonConjectures/Case006MeridionalCoupling.lean"
      - "NewtonConjectures/Case006FlatMeridionalDoublePrimitive.lean"
      - "NewtonConjectures/Case006MeridionalMomentRepair.lean"
      - "NewtonConjectures/Case006RadialConeDual.lean"
      - "NewtonConjectures/Case006SourceNativeAxialFlux.lean"
      - "NewtonConjectures/Case006SeparableShear.lean"
      - "NewtonConjectures/Case006LeadingCoreShear.lean"
      - ".github/workflows/case006-h8-symbol.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-symbol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact rational SOS and determinant replay
        run: python cases/006/attack002/verify_symbol.py
      - name: Sharp seven-ray norm and dual-polynomial replay
        run: python cases/006/attack003/verify_dual.py
      - name: Verify ungauged characteristic axis and periodic Fourier right inverse
        run: python cases/006/attack004/verify_operator.py
      - name: Install exact symbolic algebra for quadratic-adjoint checks
        run: python -m pip install 'sympy==1.14.0'
      - name: Three exact quadratic adjoint-moment polynomial checks
        run: python cases/006/attack005/verify_quadratic.py
      - name: Verify complete 10-dimensional adjoint kernel and finite type
        run: python cases/006/attack006/verify_finite_type.py
      - name: Test exact source-native Jacobian algebra and fixed-frame half-turn rank screen
        run: python cases/006/attack007/verify_source_jacobian.py
      - name: Test sharp quadratic determinant conditioning and interval certificate
        run: python cases/006/attack008/verify_conditioning.py
      - name: Exact tilted-frame angular projection and source torque check
        run: python cases/006/attack009/verify_tilt_torque.py
      - name: Exact C4 versus SO2 quadratic moment projector
        run: python cases/006/attack010/verify_c4.py
      - name: Exact C4 frame transport, curl and complete-source moment check
        run: python cases/006/attack011/verify_frame_transport.py
      - name: Source-native cylindrical centre, complete shaper and torque replay
        run: python cases/006/attack012/verify_cylindrical_frame.py
      - name: Exact viscous torque actuator and two dual compatibilities
        run: python cases/006/attack013/verify_exact_torque_viscosity.py
      - name: Exact source mixed-profile two-control torque rank audit
        run: python cases/006/attack014/verify_mixed_profile_controls.py
      - name: Exact normalized curved-shell profile and conditional inverse replay
        run: python cases/006/attack015/verify_normalized_inverse.py
      - name: Exact cumulative H8 angular cone-flux and torque-primitive check
        run: python cases/006/attack016/verify_flux_obstruction.py
      - name: Exact radial angular cone dual and perfect-flux counterexample
        run: python cases/006/attack017/verify_angular_dual.py
      - name: Exact angular weak duality finite-grid cut and cone saturation tests
        run: python cases/006/attack018/verify_angular_weak_duality.py
      - name: Exact interior smooth lifting reserve and flat-envelope obstruction
        run: python cases/006/attack019/verify_interior_lifting.py
      - name: Flat-boundary Hardy lift and adaptive commutator exact replay
        run: python cases/006/attack020/verify_flat_boundary.py
      - name: Exact Piola flat-boundary divergence-preserving and rational reserve replay
        run: python cases/006/attack021/verify_piola_flat_lifting.py
      - name: Exact coupled meridional H8 polar and cone-margin verifier
        run: python cases/006/attack022/verify_coupled_meridional.py
      - name: Exact flat meridional double-primitive and compact pressure replay
        run: python cases/006/attack023/verify_meridional_flat_lift.py
      - name: Appendix AA exact meridional global moments and E-D repair
        run: python cases/006/attack024/verify_meridional_balance_repair.py
      - name: Appendix AB sharp radial and logarithmic weighted cone dual checks
        run: python cases/006/attack025/verify_log_weighted_dual.py
      - name: Case006 source-native axial stress flux and boundary gauge exact replay
        run: python cases/006/attack026/verify_source_native_axial_flux.py
      - name: Case006 two-profile poloidal shear and diagnostic source gate
        run: python cases/006/attack027/verify_separable_shear.py
      - name: Leading exact-core comparison cross shear and flat-edge obstruction
        run: python cases/006/attack028/verify_exact_core_cross_shear.py
