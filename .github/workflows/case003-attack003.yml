name: Case 003 Attack 003 parity orbit and snark CSP gate
on:
  push:
    paths:
      - 'cases/003/attack003/**'
      - '.github/workflows/case003-attack003.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-orbit-and-positive-snarks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sparse6 parser
        run: python -m pip install 'networkx>=3.2'
      - name: Run nine independent positive CSP replays and ten-state exact orbit enumeration
        run: python cases/003/attack003/verify_attack003.py
