name: Reproduce exact certificates
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  case001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact rational certificate
        run: python cases/001/verify.py --output /tmp/case001.json --max-n 160
      - name: Independent unit tests
        run: python -m unittest discover -s cases/001/tests -v
