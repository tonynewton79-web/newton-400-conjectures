name: Build and archive publication PDF
on:
  push:
    paths:
      - 'cases/001/paper/**'
      - 'cases/001/verify.py'
      - 'cases/001/LEAN_STATUS.md'
      - '.github/workflows/build-paper.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LaTeX compiler
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra lmodern
      - name: Produce independent exact certificate
        run: python cases/001/verify.py --output cases/001/certificates/verification.json --max-n 160
      - name: Compile scientific manuscript
        working-directory: cases/001/paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
      - name: Upload PDF and certificate artifact
        uses: actions/upload-artifact@v4
        with:
          name: case001-paper-and-certificates
          path: |
            cases/001/paper/main.pdf
            cases/001/certificates/verification.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive release files in this repository
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cases/001/paper/main.pdf cases/001/certificates/verification.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build Case 001 PDF and exact certificate [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Published generated PDF and certificate."
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "Could not archive current PDF after three rebases."
                exit 1
              fi
            done
          fi
