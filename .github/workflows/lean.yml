name: Lean 4 / mathlib formal verification
on:
  push:
    paths:
      - "NewtonConjectures.lean"
      - "lakefile.toml"
      - "lean-toolchain"
      - ".github/workflows/lean.yml"
  pull_request:
  workflow_dispatch:

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          build: true
          use-mathlib-cache: true
          axiom-audit: true
      - name: Fail on proof placeholders
        shell: bash
        run: |
          if grep -En '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' NewtonConjectures.lean; then
            echo "Unexpected proof placeholder"
            exit 1
          fi
